<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="mooting-base" content="%%BASE%%">
  <base href="%%BASE_HREF%%">
  <title>交互测试</title>
  <link rel="stylesheet" href="dsh-views.css">
  <link rel="stylesheet" href="styles.css">
  <script src="boot.js"></script>
  <script src="dsh-views.js" defer></script>
  <script src="audio-capture.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="model-settings" class="settings-dialog" aria-labelledby="settings-title">
      <header class="settings-header"><h2 id="settings-title">设置</h2><button id="close-settings" class="text-button" type="button" aria-label="关闭设置">关闭</button></header>
      <div class="settings-section-title"><h3>模型配置</h3><span id="config-status" class="muted">未配置</span></div>
      <p class="protocol-note">协议：Responses API · POST /responses</p>
      <form id="model-form" class="settings-body">
        <fieldset><legend>Router</legend><div class="config-grid">
          <label>Base URL<input id="router-base-url" type="url" placeholder="http://127.0.0.1:8000/v1" required></label>
          <label>模型名称<input id="router-model" type="text" placeholder="模型 ID" required></label>
          <label>API Key<input id="router-api-key" type="password" autocomplete="new-password" placeholder="无密钥可留空"></label>
        </div></fieldset>
        <div class="submit-row"><span class="field-help">密钥不会回填；留空保留已有密钥。保存配置不代表连接已验证。</span><button id="save-model" class="secondary-button" type="submit">保存配置</button></div>
        <p id="config-feedback" class="field-help" role="status"></p>
      </form>
    </dialog>
    <div class="lab-grid">
      <section class="panel output-panel" aria-label="输出"><div class="screen"><div class="panel-heading output-status system-bar"><time id="output-date" class="output-date">--/-- 周-</time><span class="system-right"><time id="output-title" class="output-clock">--:--</time><span class="output-battery" title="电量（模拟）"><svg class="battery-icon" viewBox="0 0 28 14" aria-hidden="true" focusable="false"><rect x="0.75" y="0.75" width="22.5" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M24.2 4.2h1.6a1 1 0 0 1 1 1v3.6a1 1 0 0 1-1 1h-1.6z" fill="currentColor"/><rect x="2.4" y="2.5" width="13.2" height="9" rx="1" fill="currentColor"/></svg></span></span></div><div id="output-stage" class="output-stage"><div class="content-row"><div class="main-column"><div id="agent-panel" class="agent-panel" aria-label="agent panel" aria-hidden="true"><div id="interaction-window" class="interaction-window" aria-live="polite"><p class="agent-label">Agent</p><div id="output-text" class="output-text"></div></div></div><div id="main-panel" class="main-panel" aria-label="main panel"><div id="main-text" class="output-text main-text"></div></div></div><div id="function-panel" class="function-panel" aria-label="function panel" aria-hidden="true"><div id="function-window" class="interaction-window" aria-live="polite"><section id="speaker-card" class="speaker-card" aria-labelledby="speaker-card-title" hidden><h3 id="speaker-card-title">—</h3><div class="speaker-role"><dt>身份</dt><dd id="speaker-identity">—</dd></div><div class="speaker-notes-block"><p class="speaker-notes-label">信息</p><div id="speaker-notes">—</div></div></section></div></div></div></div><footer class="guide-panel" aria-label="guide panel"><span class="guide-key">头部</span><span class="guide-hint">左歪关闭 · 右歪展开</span></footer></div></section>
      <div class="side-stack">
        <section class="panel control-panel" aria-labelledby="input-title"><div class="panel-heading control-heading"><h1 id="input-title">控制面板</h1><button id="audio-toggle" class="audio-toggle" type="button" aria-label="开启语音输入" aria-pressed="false" title="开启语音输入"><svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5 18 12 8 18.5Z" fill="currentColor"/></svg><svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor"/></svg></button></div><div class="panel-body control-actions"><form id="submit-form" novalidate><button id="submit-button" class="primary-button" type="submit" aria-label="右键" disabled>右键</button></form><button id="open-agent" class="esc-button" type="button" aria-label="打开 agent 面板" disabled>打开 agent 面板</button><button id="open-function" class="esc-button" type="button" aria-label="打开功能面板" disabled>打开功能面板</button><button id="close-agent" class="esc-button" type="button" aria-label="关闭 agent panel" disabled>关闭 agent panel</button><button id="esc-button" class="esc-button" type="button" aria-label="关闭功能面板" disabled>关闭功能面板</button><button id="voiceprints-link" class="esc-button" type="button">声纹</button></div></section>
        <section class="panel stream-panel" aria-labelledby="inform-stream-title"><div class="panel-heading"><h2 id="inform-stream-title">信息流</h2></div><div class="inform-stream"><textarea id="inform_stream" rows="2" readonly placeholder="语音识别会显示在这里" aria-labelledby="inform-stream-title"></textarea></div></section>
        <section class="panel router-panel" aria-labelledby="agent-title"><div class="panel-heading"><h2 id="agent-title">Router</h2><span id="agent-status" class="badge">等待输入</span></div><div id="agent-conversation" class="dsh-view"></div><p id="views-error" class="view-error" role="alert" hidden></p></section>
      </div>
    </div>
    <div class="context-row">
      <section class="panel context-panel" aria-labelledby="context-title"><div class="panel-heading memory-heading"><div class="memory-title"><h2 id="context-title">Context</h2><span id="context-status" class="badge">等待信息流</span></div><p id="context-memory-info" class="memory-info muted" hidden></p></div><div class="context-body"><div class="context-assembly"><div class="context-assembly-heading"><h3 id="context-fragment-title" class="context-section-title">最近原话</h3></div><pre id="context-snapshot" class="context-snapshot" aria-labelledby="context-fragment-title">还没有识别到原话。</pre></div><div class="context-assembly context-injected"><div class="context-assembly-heading"><h3 id="context-injected-title" class="context-section-title">注入 Router 的记忆</h3></div><pre id="context-injected" class="context-snapshot" aria-labelledby="context-injected-title">当前没有可注入的记忆。</pre></div></div></section>
    </div>
    <div class="detail-grid">
      <section class="panel context-trace-panel" aria-labelledby="context-trace-title"><div class="panel-heading"><h2 id="context-trace-title">Context System Trace</h2><span id="context-trace-count" class="count">0</span></div><div id="context-trace-view" class="context-trace-view" role="region" aria-label="Context System 执行轨迹" tabindex="0"><table><thead><tr><th scope="col">时间</th><th scope="col">阶段</th><th scope="col">执行详情</th></tr></thead><tbody id="context-trace-rows"></tbody></table></div></section>
      <section class="panel trace-panel" aria-labelledby="trace-title"><div class="panel-heading"><h2 id="trace-title">Agent Trace</h2><span id="trace-count" class="count">0</span></div><div id="trajectory-view" class="dsh-view"></div><details class="raw-events"><summary>原始事件与任务数据</summary><pre id="raw-events">[]</pre></details></section>
    </div>
  </main>
</body>
</html>
