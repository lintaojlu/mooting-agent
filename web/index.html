<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>交互测试</title>
  <link rel="stylesheet" href="/dsh-views.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/dsh-views.js" defer></script>
  <script src="/audio-capture.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="model-settings" class="settings-dialog" aria-labelledby="settings-title">
      <header class="settings-header"><h2 id="settings-title">设置</h2><button id="close-settings" class="text-button" type="button" aria-label="关闭设置">关闭</button></header>
      <div class="settings-section-title"><h3>模型配置</h3><span id="config-status" class="muted">未配置</span></div>
      <p class="protocol-note">协议：Responses API · POST /responses</p>
      <form id="model-form" class="settings-body">
        <fieldset><legend>Router</legend><div class="config-grid">
          <label>Base URL<input id="router-base-url" type="url" placeholder="http://127.0.0.1:8000/v1" required></label>
          <label>模型名称<input id="router-model" type="text" placeholder="模型 ID" required></label>
          <label>API Key<input id="router-api-key" type="password" autocomplete="new-password" placeholder="无密钥可留空"></label>
        </div></fieldset>
        <label class="checkbox-label"><input id="worker-uses-router" type="checkbox" checked>Worker 复用 Router 模型配置</label>
        <fieldset id="worker-settings" hidden><legend>Worker</legend><div class="config-grid">
          <label>Base URL<input id="worker-base-url" type="url" placeholder="https://模型服务/v1"></label>
          <label>模型名称<input id="worker-model" type="text" placeholder="模型 ID"></label>
          <label>API Key<input id="worker-api-key" type="password" autocomplete="new-password" placeholder="无密钥可留空"></label>
        </div></fieldset>
        <div class="submit-row"><span class="field-help">密钥不会回填；留空保留已有密钥。保存配置不代表连接已验证。</span><button id="save-model" class="secondary-button" type="submit">保存配置</button></div>
        <p id="config-feedback" class="field-help" role="status"></p>
      </form>
    </dialog>
    <div class="lab-grid">
      <section class="panel output-panel" aria-label="输出"><div class="panel-heading output-status"><time id="output-title" class="output-clock">--:--</time><span id="display-mode" class="badge" hidden>等待输入</span><span class="output-battery" title="电量（模拟）"><svg class="battery-icon" viewBox="0 0 28 14" aria-hidden="true" focusable="false"><rect x="0.75" y="0.75" width="22.5" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M24.2 4.2h1.6a1 1 0 0 1 1 1v3.6a1 1 0 0 1-1 1h-1.6z" fill="currentColor"/><rect x="2.4" y="2.5" width="13.2" height="9" rx="1" fill="currentColor"/></svg></span></div><div id="output-stage" class="output-stage"><div class="output-split"><div id="agent-panel" class="agent-panel" aria-label="agent panel"><div id="interaction-window" class="interaction-window" aria-live="polite"><div id="output-text" class="output-text"><div class="output-turn output-turn-assistant"><span class="output-avatar" aria-hidden="true">(ovo)</span><p class="output-turn-body">已准备好做你的co-pilot！</p></div></div></div></div><div id="function-panel" class="function-panel" aria-label="function panel" aria-hidden="true"><div id="function-window" class="interaction-window" aria-live="polite"><div id="function-text" class="output-text"></div><section id="speaker-card" class="speaker-card" aria-labelledby="speaker-card-title" hidden><h3 id="speaker-card-title">—</h3><div class="speaker-role"><dt>身份</dt><dd id="speaker-identity">—</dd></div><div class="speaker-notes-block"><p class="speaker-notes-label">信息</p><div id="speaker-notes">—</div></div></section></div></div></div><div id="command-shell" class="command-shell"><span class="command-mark" aria-hidden="true">(ovo)</span><div id="command-panel" class="command-panel" aria-label="command panel" aria-hidden="true"><div id="command-text" class="output-text command-text"></div></div></div></div></section>
      <section class="panel control-panel" aria-labelledby="input-title"><div class="panel-heading"><h1 id="input-title">控制面板</h1></div><div class="panel-body control-actions"><button id="audio-toggle" class="audio-toggle" type="button" aria-label="开启语音输入" aria-pressed="false" title="开启语音输入"><svg class="play-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5 18 12 8 18.5Z" fill="currentColor"/></svg><svg class="pause-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor"/></svg></button><form id="submit-form" novalidate><button id="submit-button" class="primary-button" type="submit" aria-label="发送指令" disabled>confirm</button></form><button id="esc-button" class="esc-button" type="button" aria-label="关闭功能" disabled>esc</button></div></section>
    </div>
    <div class="detail-grid">
      <section class="panel context-panel" aria-labelledby="context-title"><div class="panel-heading"><h2 id="context-title">Context</h2></div><div class="inform-stream"><h3 id="inform-stream-title" class="context-section-title">信息流</h3><textarea id="inform_stream" rows="4" readonly placeholder="语音识别会显示在这里" aria-labelledby="inform-stream-title"></textarea></div><div class="context-assembly"><div class="context-assembly-heading"><h3 id="context-fragment-title" class="context-section-title">context片段</h3><span id="context-status" class="badge">等待信息流</span></div><pre id="context-snapshot" class="context-snapshot" aria-labelledby="context-fragment-title">尚未形成记忆。</pre></div></section>
      <section class="panel" aria-labelledby="agent-title"><div class="panel-heading"><h2 id="agent-title">Router</h2><span id="agent-status" class="badge">等待输入</span></div><div id="agent-conversation" class="dsh-view"></div><p id="views-error" class="view-error" role="alert" hidden></p></section>
      <section class="panel" aria-labelledby="worker-title"><div class="panel-heading"><h2 id="worker-title">Worker</h2><span id="worker-status" class="badge">等待任务</span></div><div id="worker-conversation" class="dsh-view"></div></section>
    </div>
    <section class="panel trace-panel" aria-labelledby="trace-title"><div class="panel-heading"><h2 id="trace-title">执行轨迹</h2><span id="trace-count" class="count">0</span></div><div id="trajectory-view" class="dsh-view"></div><details class="raw-events"><summary>原始事件与任务数据</summary><pre id="raw-events">[]</pre></details></section>
  </main>
</body>
</html>
