plugins { id 'com.android.application' }

android {
    namespace 'com.s23u.atomicclient'
    compileSdk 36
    defaultConfig {
        applicationId 'com.s23u.atomicclient'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0.0-alpha1'
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['wav'] }
    ndkVersion '30.0.16248370'
    def localNdkPath = providers.gradleProperty('ndk.local.path').orNull
    if (localNdkPath) ndkPath localNdkPath
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies { implementation files('libs/atomic-api-debug.aar') }

