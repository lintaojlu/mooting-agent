server {
  server_name nillin.space;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location = /mooting-agent {
    return 308 /mooting-agent/;
  }

  location /mooting-agent/ {
    proxy_pass http://127.0.0.1:4317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  location / {
    default_type text/plain;
    return 200 "nillin.space\n";
  }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nillin.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nillin.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = nillin.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name nillin.space;
    return 404; # managed by Certbot


}