- insert:
    - id: mooting-log
      name: ./src/log/plugin.mjs
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: 'You are MootingAgent, a personal assistant.'
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-search-api
        fetchProvider: http
    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        searchTimeoutMs: 60000
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
        maxParallelToolCalls: 1
    - id: mooting-worker
      name: ./src/worker-plugin.mjs
    - id: mooting-models
      name: ./src/models-plugin.mjs
    - id: sound2text
      name: ./src/sound2text/plugin.mjs
    - id: mooting-capabilities
      name: ./src/capabilities-plugin.mjs
    - id: mooting-context
      name: ./src/context/plugin.mjs
    - id: mooting-router
      name: ./src/index.mjs
      config:
        port: 4317
